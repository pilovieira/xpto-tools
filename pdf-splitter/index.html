<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Splitter — XPTO Tools</title>
  <meta name="description" content="Split a PDF into single-page files.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    .pages { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
    .page-tile {
      display: flex; flex-direction: column; gap: 12px; padding: 14px; text-align: center;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
      transition: border-color .15s, transform .15s;
    }
    .page-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
    .page-thumb {
      aspect-ratio: 3 / 4; display: grid; place-items: center; border-radius: 6px;
      background: #fff; color: #9aa2ba; box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
      font: 700 28px var(--font);
    }
    :root[data-theme="light"] .page-thumb { border: 1px solid var(--border-2); }
    .page-thumb small { display: block; font: 600 10px var(--font); letter-spacing: .1em; text-transform: uppercase; }
  </style>
</head>
<body data-area="public" data-active="pdf-splitter">
  <main class="container narrow">
    <div data-page-head data-tool="pdf-splitter"></div>

    <section class="card stack">
      <label class="dropzone" id="dropZone">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
        <strong>Drop a PDF here, or click to browse</strong>
        <span>PDF files up to 50 MB</span>
        <input type="file" id="fileInput" accept="application/pdf">
      </label>

      <div class="alert alert-info row" style="gap:10px; flex-wrap:nowrap">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>Pages are split in your browser. A copy of the uploaded file is also kept on the server for a few days for administrative review.</span>
      </div>

      <div id="status" class="row hidden" style="gap:12px"><div class="loader" style="padding:0"></div><span id="statusText">Working…</span></div>

      <div id="info" class="row between hidden" style="padding:14px 16px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px">
        <div style="min-width:0">
          <div id="fileName" style="font-weight:600; word-break:break-all"></div>
          <div id="fileMeta" class="muted" style="font-size:13px"></div>
        </div>
        <button class="btn btn-primary" id="zipBtn"></button>
      </div>

      <div class="pages" id="pages"></div>
    </section>
  </main>

  <script>
    let currentFilename = '';
    let splitPages = []; // Uint8Array per single-page PDF

    const dropZone = X.$('#dropZone');
    const fileInput = X.$('#fileInput');
    X.$('#zipBtn').innerHTML = `${X.icon('archive', 'icon-sm')} Download all as ZIP`;

    ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
    dropZone.addEventListener('drop', e => { if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

    const setStatus = text => {
      X.$('#status').classList.toggle('hidden', !text);
      if (text) X.$('#statusText').textContent = text;
    };

    /** Keep a copy on the server; failing here never blocks the split itself */
    async function uploadCopy(file) {
      try {
        const res = await fetch('/pdf-splitter/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/pdf', 'X-Filename': encodeURIComponent(file.name) },
          body: file
        });
        if (!res.ok) console.warn('PDF copy was not stored:', res.status);
      } catch (e) {
        console.warn('PDF copy was not stored:', e);
      }
    }

    async function handleFile(file) {
      if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) return X.toast('Please select a PDF file.', 'error');
      if (file.size > 50 * 1024 * 1024) return X.toast('That file is larger than 50 MB.', 'error');

      currentFilename = file.name;
      X.$('#info').classList.add('hidden');
      X.$('#pages').innerHTML = '';
      splitPages = [];

      try {
        setStatus('Reading PDF…');
        const bytes = new Uint8Array(await file.arrayBuffer());
        uploadCopy(file);

        setStatus('Splitting pages…');
        const source = await PDFLib.PDFDocument.load(bytes);
        const count = source.getPageCount();
        if (!count) throw new Error('This PDF has no pages.');

        for (let i = 0; i < count; i++) {
          const doc = await PDFLib.PDFDocument.create();
          const [page] = await doc.copyPages(source, [i]);
          doc.addPage(page);
          splitPages.push(await doc.save());
        }

        X.$('#pages').innerHTML = splitPages.map((_, i) => `
          <div class="page-tile">
            <div class="page-thumb"><div><small>Page</small>${i + 1}</div></div>
            <button class="btn btn-sm" data-page="${i}">${X.icon('download', 'icon-sm')} Download</button>
          </div>`).join('');

        X.$('#fileName').textContent = file.name;
        X.$('#fileMeta').textContent = `${count} page${count > 1 ? 's' : ''} · ${X.fmtBytes(file.size)}`;
        X.$('#info').classList.remove('hidden');
        X.toast('PDF split successfully');
      } catch (e) {
        console.error(e);
        X.toast('Could not process PDF: ' + e.message, 'error');
      } finally {
        setStatus('');
        fileInput.value = '';
      }
    }

    const baseName = () => currentFilename.replace(/\.pdf$/i, '');

    function save(blob, name) {
      const url = URL.createObjectURL(blob);
      Object.assign(document.createElement('a'), { href: url, download: name }).click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    X.$('#pages').addEventListener('click', e => {
      const btn = e.target.closest('[data-page]');
      if (!btn) return;
      const i = +btn.dataset.page;
      save(new Blob([splitPages[i]], { type: 'application/pdf' }), `${baseName()}_page_${i + 1}.pdf`);
    });

    X.$('#zipBtn').addEventListener('click', async () => {
      if (!splitPages.length) return;
      const zip = new JSZip();
      splitPages.forEach((bytes, i) => zip.file(`${baseName()}_page_${i + 1}.pdf`, bytes));
      try {
        save(await zip.generateAsync({ type: 'blob' }), `${baseName()}_split_pages.zip`);
        X.toast('ZIP download started');
      } catch (err) {
        X.toast('Failed to build ZIP: ' + err.message, 'error');
      }
    });
  </script>
</body>
</html>
