<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener — XPTO Tools</title>
  <meta name="description" content="Turn long URLs into short, shareable links.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
</head>
<body data-area="public" data-active="shortener">
  <main class="container narrow">
    <div data-page-head data-tool="shortener"></div>

    <section class="card" aria-live="polite">
      <form id="form" class="stack" novalidate>
        <div class="field">
          <label for="url">Destination URL</label>
          <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <input class="input" id="url" type="text" inputmode="url" placeholder="https://example.com/a/very/long/url" autocomplete="off" spellcheck="false" autofocus>
          </div>
        </div>
        <div id="fail" class="alert hidden" role="alert"></div>
        <button class="btn btn-primary btn-lg" id="submit" type="submit">Shorten URL</button>
      </form>

      <div id="result" class="stack hidden">
        <div class="label">Your short link</div>
        <div class="output has-value" style="min-height:0">
          <a id="shortUrl" href="#" target="_blank" rel="noopener"></a>
          <button class="btn btn-sm" id="copyBtn" type="button"></button>
        </div>
        <div class="row">
          <a class="btn btn-sm" id="openBtn" href="#" target="_blank" rel="noopener"></a>
          <button class="btn btn-sm btn-ghost" id="newBtn" type="button"></button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = X.$('#form');
    const input = X.$('#url');
    const fail = X.$('#fail');
    const result = X.$('#result');
    const submit = X.$('#submit');
    let shortUrl = '';

    X.$('#copyBtn').innerHTML = `${X.icon('copy', 'icon-sm')} Copy`;
    X.$('#openBtn').innerHTML = `${X.icon('external', 'icon-sm')} Open`;
    X.$('#newBtn').innerHTML = `${X.icon('plus', 'icon-sm')} Shorten another`;

    function showError(message) {
      fail.textContent = message;
      fail.classList.remove('hidden');
      input.classList.add('error');
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      fail.classList.add('hidden');
      input.classList.remove('error');

      const url = input.value.trim();
      if (!url) return showError('Enter a URL to shorten.');

      submit.disabled = true;
      submit.textContent = 'Shortening…';
      try {
        const { key } = await X.api('/shortener', { method: 'POST', body: { url } });
        shortUrl = `${location.origin}/${key}`;
        X.$('#shortUrl').textContent = shortUrl;
        X.$('#shortUrl').href = shortUrl;
        X.$('#openBtn').href = shortUrl;
        form.classList.add('hidden');
        result.classList.remove('hidden');
      } catch (err) {
        showError(err.message);
      } finally {
        submit.disabled = false;
        submit.textContent = 'Shorten URL';
      }
    });

    X.$('#copyBtn').addEventListener('click', () => X.copy(shortUrl, 'Short link copied'));
    X.$('#newBtn').addEventListener('click', () => {
      input.value = '';
      result.classList.add('hidden');
      form.classList.remove('hidden');
      input.focus();
    });
  </script>
</body>
</html>
