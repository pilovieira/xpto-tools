<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Generator — XPTO Tools</title>
  <meta name="description" content="Generate secure random tokens in your browser.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
  <style>
    .tokens { display: grid; gap: 8px; }
    .tokens.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tokens.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .token {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
      transition: border-color .15s, background .15s;
    }
    .token:hover { border-color: var(--accent); background: var(--accent-soft); }
    .token.flash { border-color: var(--ok); background: var(--ok-soft); }
    .token-i { color: var(--faint); font: 600 12px var(--mono); }
    .token-v { flex: 1; min-width: 0; font: 13.5px var(--mono); word-break: break-all; }
    .token .icon { color: var(--faint); opacity: 0; transition: opacity .15s; }
    .token:hover .icon { opacity: 1; }
    .is-disabled { opacity: .4; pointer-events: none; }
    @media (max-width: 1100px) { .tokens.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) { .tokens.cols-2, .tokens.cols-3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-area="public" data-active="token">
  <main class="container">
    <div data-page-head data-tool="token"></div>

    <div class="split">
      <section class="card stack">
        <div class="card-title">Configuration</div>

        <div class="field">
          <label>Token type</label>
          <div class="seg" id="typeSeg">
            <button class="seg-btn active" data-type="hex">Hex</button>
            <button class="seg-btn" data-type="base64">Base64</button>
            <button class="seg-btn" data-type="base62">Base62</button>
            <button class="seg-btn" data-type="uuid">UUID v4</button>
            <button class="seg-btn" data-type="numeric">Numeric</button>
            <button class="seg-btn" data-type="alphanumeric">Alphanum</button>
          </div>
        </div>

        <div class="field" id="lengthField">
          <label for="length">Length</label>
          <div class="range-row"><input type="range" id="length" min="8" max="128" value="32"><span class="range-val" id="lengthVal">32</span></div>
        </div>

        <div class="field">
          <label for="quantity">Quantity</label>
          <div class="range-row"><input type="range" id="quantity" min="1" max="100" value="10"><span class="range-val" id="quantityVal">10</span></div>
        </div>

        <div class="field">
          <label for="prefix">Prefix</label>
          <input class="input" type="text" id="prefix" placeholder="e.g. tok_" autocomplete="off" spellcheck="false">
        </div>

        <div class="field" id="sepField">
          <label>Separator</label>
          <div class="seg" id="sepSeg">
            <button class="seg-btn active" data-sep="none">None</button>
            <button class="seg-btn" data-sep="-">Dash</button>
            <button class="seg-btn" data-sep="_">Underscore</button>
            <button class="seg-btn" data-sep=".">Dot</button>
          </div>
        </div>

        <div class="field" id="groupField">
          <label for="groupSize">Group every</label>
          <div class="range-row"><input type="range" id="groupSize" min="0" max="16" value="0"><span class="range-val" id="groupVal">off</span></div>
        </div>

        <button class="btn btn-primary btn-lg" id="generateBtn">Generate tokens</button>
      </section>

      <section class="card flush">
        <div class="card-head padded">
          <div>
            <div class="card-title">Generated tokens</div>
            <div class="card-sub" id="meta">Everything is generated in your browser with the Web Crypto API.</div>
          </div>
          <div class="row hidden" id="actions">
            <button class="btn btn-sm" id="copyAllBtn"></button>
            <button class="btn btn-sm" id="downloadBtn"></button>
          </div>
        </div>
        <div style="padding:20px 22px">
          <div class="empty" id="empty">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
            <strong>No tokens yet</strong>Choose your options and press “Generate tokens”.
          </div>
          <div class="tokens hidden" id="tokens"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const state = { type: 'hex', length: 32, quantity: 10, prefix: '', separator: 'none', groupSize: 0, tokens: [] };

    X.$('#copyAllBtn').innerHTML = `${X.icon('copy', 'icon-sm')} Copy all`;
    X.$('#downloadBtn').innerHTML = `${X.icon('download', 'icon-sm')} Download`;

    /* ── Controls ── */
    function bindSeg(id, attr, onPick) {
      X.$$('.seg-btn', X.$(id)).forEach(btn => btn.addEventListener('click', () => {
        X.$$('.seg-btn', X.$(id)).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        onPick(btn.dataset[attr]);
      }));
    }

    function refreshDisabled() {
      const uuid = state.type === 'uuid';
      X.$('#lengthField').classList.toggle('is-disabled', uuid);
      X.$('#sepField').classList.toggle('is-disabled', uuid);
      X.$('#groupField').classList.toggle('is-disabled', uuid);
    }

    bindSeg('#typeSeg', 'type', v => { state.type = v; refreshDisabled(); });
    bindSeg('#sepSeg', 'sep', v => { state.separator = v; });

    function bindRange(id, valId, key, fmt = v => v) {
      const el = X.$(id);
      el.addEventListener('input', () => { state[key] = +el.value; X.$(valId).textContent = fmt(state[key]); });
    }
    bindRange('#length', '#lengthVal', 'length');
    bindRange('#quantity', '#quantityVal', 'quantity');
    bindRange('#groupSize', '#groupVal', 'groupSize', v => (v === 0 ? 'off' : v));
    X.$('#prefix').addEventListener('input', e => { state.prefix = e.target.value; });

    /* ── Generation ── */
    const CHARSETS = {
      hex: '0123456789abcdef',
      base62: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
      alphanumeric: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
      numeric: '0123456789'
    };

    const randomBytes = n => crypto.getRandomValues(new Uint8Array(n));

    /** Unbiased pick from a charset: reject bytes that would skew the distribution */
    function fromCharset(charset, length) {
      const limit = 256 - (256 % charset.length);
      let out = '';
      while (out.length < length) {
        for (const b of randomBytes(length * 2)) {
          if (b < limit && out.length < length) out += charset[b % charset.length];
        }
      }
      return out;
    }

    function base64Url(length) {
      const bytes = randomBytes(Math.ceil(length * 3 / 4));
      return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '').slice(0, length);
    }

    function uuid4() {
      if (crypto.randomUUID) return crypto.randomUUID();
      const b = randomBytes(16);
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
      return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
    }

    function generateToken() {
      if (state.type === 'uuid') return state.prefix + uuid4();
      let raw = state.type === 'base64' ? base64Url(state.length) : fromCharset(CHARSETS[state.type], state.length);
      if (state.separator !== 'none' && state.groupSize > 0) {
        raw = raw.match(new RegExp(`.{1,${state.groupSize}}`, 'g')).join(state.separator);
      }
      return state.prefix + raw;
    }

    /* ── Rendering ── */
    function render() {
      const tokens = state.tokens;
      const grid = X.$('#tokens');
      X.$('#empty').classList.toggle('hidden', tokens.length > 0);
      grid.classList.toggle('hidden', tokens.length === 0);
      X.$('#actions').classList.toggle('hidden', tokens.length === 0);
      if (!tokens.length) return;

      const len = tokens[0].length;
      grid.className = 'tokens ' + (len <= 20 ? 'cols-3' : len <= 40 ? 'cols-2' : '');
      grid.innerHTML = tokens.map((t, i) => `
        <button class="token" type="button" data-i="${i}" title="Click to copy">
          <span class="token-i">${String(i + 1).padStart(2, '0')}</span>
          <span class="token-v">${X.esc(t)}</span>
          ${X.icon('copy', 'icon-sm')}
        </button>`).join('');
    }

    X.$('#tokens').addEventListener('click', async e => {
      const btn = e.target.closest('.token');
      if (!btn) return;
      if (await X.copy(state.tokens[+btn.dataset.i], 'Token copied')) {
        btn.classList.add('flash');
        setTimeout(() => btn.classList.remove('flash'), 450);
      }
    });

    X.$('#generateBtn').addEventListener('click', () => {
      const t0 = performance.now();
      state.tokens = Array.from({ length: state.quantity }, generateToken);
      const ms = (performance.now() - t0).toFixed(1);
      render();
      X.$('#meta').textContent = `${state.quantity} ${state.type} token${state.quantity > 1 ? 's' : ''} in ${ms} ms · generated in your browser`;
      X.track('/token/log', {
        type: state.type, length: state.type === 'uuid' ? 36 : state.length, quantity: state.quantity,
        prefix: state.prefix, separator: state.separator, groupSize: state.groupSize
      });
    });

    X.$('#copyAllBtn').addEventListener('click', () => X.copy(state.tokens.join('\n'), 'All tokens copied'));
    X.$('#downloadBtn').addEventListener('click', () => {
      const url = URL.createObjectURL(new Blob([state.tokens.join('\n')], { type: 'text/plain' }));
      Object.assign(document.createElement('a'), { href: url, download: `tokens-${state.type}-${Date.now()}.txt` }).click();
      URL.revokeObjectURL(url);
      X.toast('Tokens file downloaded');
    });
  </script>
</body>
</html>
