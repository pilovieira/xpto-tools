<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPTO - Token Generator Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-teal: #14b8a6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glass-bg: rgba(17, 24, 39, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      background-image:
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.12) 0px, transparent 40%),
        radial-gradient(at 100% 100%, rgba(20, 184, 166, 0.1) 0px, transparent 40%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .logo-section { display: flex; flex-direction: column; }

    .logo-text {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #a78bfa 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    .nav-buttons { display: flex; gap: 12px; }

    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 10px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--danger);
    }

    .nav-btn.back:hover {
      background: rgba(139, 92, 246, 0.1);
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
    }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 36px;
    }

    .stat-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
    }

    .stat-purple::after { background: var(--accent-purple); }
    .stat-pink::after   { background: var(--accent-pink); }
    .stat-teal::after   { background: var(--accent-teal); }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 38px;
      font-weight: 600;
      background: linear-gradient(135deg, #fff 0%, #ccc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    /* Controls */
    .controls-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 10px 16px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-input:focus {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .filter-select {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 10px 16px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .filter-select:focus { border-color: rgba(139, 92, 246, 0.5); }
    .filter-select option { background: #111827; }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-muted);
      width: 40px; height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .refresh-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
    }

    .refresh-btn.spinning svg { animation: spin 0.6s linear infinite; }

    /* Table Card */
    .table-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .table-title { font-size: 20px; font-weight: 600; }
    .table-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .table-wrapper { overflow-x: auto; width: 100%; }

    table { width: 100%; border-collapse: collapse; text-align: left; }

    th {
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--glass-border);
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.015); }

    /* Badges */
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .type-hex       { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.25); }
    .type-base64    { background: rgba(236, 72, 153, 0.15); color: #f9a8d4; border: 1px solid rgba(236, 72, 153, 0.25); }
    .type-base62    { background: rgba(20, 184, 166, 0.15); color: #99f6e4; border: 1px solid rgba(20, 184, 166, 0.25); }
    .type-uuid      { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.25); }
    .type-numeric   { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.25); }
    .type-alphanum  { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.25); }

    .ip-badge {
      background: rgba(20, 184, 166, 0.1);
      color: #5eead4;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      white-space: nowrap;
    }

    .ua-text {
      color: var(--text-muted);
      font-size: 12px;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
    }

    .timestamp-cell { font-size: 13px; color: var(--text-muted); white-space: nowrap; }

    .mono-cell {
      font-family: monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Spinner */
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      border-top: 3px solid var(--accent-purple);
      width: 40px; height: 40px;
      animation: spin 0.8s linear infinite;
      margin: 40px auto;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .empty-state { text-align: center; padding: 60px 40px; color: var(--text-muted); }
    .empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
    .empty-state-title { font-size: 18px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #111827;
      border: 1px solid var(--glass-border);
      border-left: 4px solid var(--success);
      padding: 16px 24px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast-danger { border-left-color: var(--danger); }

    @media (max-width: 700px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .controls-bar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div class="logo-section">
        <div class="logo-text">XPTO</div>
        <div class="subtitle">Token Generator — Admin Logs</div>
      </div>
      <div class="nav-buttons">
        <a href="/admin" class="nav-btn back">Back to Hub</a>
        <a href="/admin/logout" class="nav-btn">Logout</a>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card stat-purple">
        <div class="stat-label">Total Generations</div>
        <div class="stat-value" id="statTotal">—</div>
      </div>
      <div class="stat-card stat-pink">
        <div class="stat-label">Total Tokens Produced</div>
        <div class="stat-value" id="statTokens">—</div>
      </div>
      <div class="stat-card stat-teal">
        <div class="stat-label">Unique IPs</div>
        <div class="stat-value" id="statIps">—</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search by IP, type, prefix or user agent…"
        oninput="applyFilters()"
        autocomplete="off"
      >
      <select class="filter-select" id="typeFilter" onchange="applyFilters()">
        <option value="all">All types</option>
        <option value="hex">Hex</option>
        <option value="base64">Base64</option>
        <option value="base62">Base62</option>
        <option value="uuid">UUID</option>
        <option value="numeric">Numeric</option>
        <option value="alphanumeric">Alphanumeric</option>
      </select>
      <button class="refresh-btn" id="refreshBtn" onclick="fetchLogs()" title="Refresh logs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-header">
        <div>
          <div class="table-title">Generation Logs</div>
          <div class="table-subtitle">Last 100 token generation operations</div>
        </div>
      </div>

      <div id="loading" class="spinner"></div>

      <div id="tableContainer" style="display:none;">
        <div class="table-wrapper">
          <table id="logsTable">
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Type</th>
                <th>Length</th>
                <th>Quantity</th>
                <th>Prefix</th>
                <th>Client IP</th>
                <th>User Agent</th>
              </tr>
            </thead>
            <tbody id="logsBody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state" style="display:none;">
          <div class="empty-state-icon">⬡</div>
          <div class="empty-state-title">No logs found</div>
          <div>No token generation operations match your current filter.</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let allLogs = [];

    function showToast(message, isDanger = false) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.toggle('toast-danger', isDanger);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function formatDate(isoString) {
      const d = new Date(isoString);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} `
           + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getTypeBadgeClass(type) {
      const map = {
        hex: 'type-hex',
        base64: 'type-base64',
        base62: 'type-base62',
        uuid: 'type-uuid',
        numeric: 'type-numeric',
        alphanumeric: 'type-alphanum'
      };
      return map[type] || 'type-hex';
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const typeFilter = document.getElementById('typeFilter').value;

      const filtered = allLogs.filter(log => {
        if (typeFilter !== 'all' && log.type !== typeFilter) return false;
        if (query) {
          const haystack = [log.ip, log.type, log.prefix, log.userAgent]
            .join(' ').toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      });

      renderTable(filtered);
    }

    function renderTable(logs) {
      const tbody = document.getElementById('logsBody');
      const emptyState = document.getElementById('emptyState');
      const tableEl = document.getElementById('logsTable');

      tbody.innerHTML = '';

      if (logs.length === 0) {
        tableEl.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      tableEl.style.display = 'table';
      emptyState.style.display = 'none';

      logs.forEach(log => {
        const row = document.createElement('tr');
        const badgeClass = getTypeBadgeClass(log.type);

        row.innerHTML = `
          <td class="timestamp-cell">${escHtml(formatDate(log.timestamp))}</td>
          <td><span class="type-badge ${badgeClass}">${escHtml(log.type)}</span></td>
          <td class="mono-cell">${log.type === 'uuid' ? '36' : escHtml(log.length)}</td>
          <td class="mono-cell">${escHtml(log.quantity)}</td>
          <td class="mono-cell">${escHtml(log.prefix || '—')}</td>
          <td><span class="ip-badge">${escHtml(log.ip || '—')}</span></td>
          <td><span class="ua-text" title="${escHtml(log.userAgent || '')}">${escHtml(log.userAgent || '—')}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    async function fetchLogs() {
      const loading = document.getElementById('loading');
      const tableContainer = document.getElementById('tableContainer');
      const refreshBtn = document.getElementById('refreshBtn');

      loading.style.display = 'block';
      tableContainer.style.display = 'none';
      refreshBtn.classList.add('spinning');

      try {
        const response = await fetch('/admin/token/data');
        if (!response.ok) {
          if (response.status === 401) {
            window.location.href = '/admin';
            return;
          }
          throw new Error('Failed to load token logs');
        }

        const data = await response.json();
        allLogs = data.logs || [];

        // Update stats
        document.getElementById('statTotal').innerText = allLogs.length;
        const totalTokens = allLogs.reduce((sum, l) => sum + (l.quantity || 0), 0);
        document.getElementById('statTokens').innerText = totalTokens.toLocaleString();
        const uniqueIps = new Set(allLogs.map(l => l.ip)).size;
        document.getElementById('statIps').innerText = uniqueIps;

        applyFilters();
      } catch (err) {
        showToast('Error loading logs: ' + err.message, true);
      } finally {
        loading.style.display = 'none';
        tableContainer.style.display = 'block';
        refreshBtn.classList.remove('spinning');
      }
    }

    document.addEventListener('DOMContentLoaded', fetchLogs);
  </script>
</body>
</html>
