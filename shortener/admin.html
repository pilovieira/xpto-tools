<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortener Admin — XPTO Tools</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
</head>
<body data-area="admin" data-active="shortener">
  <main class="container wide">
    <div data-page-head data-tool="shortener"></div>
    <div id="stats"></div>

    <section class="card" style="margin-bottom:20px">
      <div class="card-head"><div class="card-title">Create a short link</div></div>
      <form id="createForm" class="row" style="align-items:flex-end" novalidate>
        <div class="field" style="flex:1; min-width:160px; max-width:260px">
          <label for="createKey">Short key</label>
          <input class="input" id="createKey" placeholder="my-link" autocomplete="off" spellcheck="false">
        </div>
        <div class="field" style="flex:3; min-width:240px">
          <label for="createUrl">Destination URL</label>
          <input class="input" id="createUrl" placeholder="https://example.com/long-url" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn btn-primary" id="createBtn" type="submit"></button>
      </form>
    </section>

    <section class="card flush">
      <div class="tabs">
        <button class="tab active" data-tab="keys">Short links</button>
        <button class="tab" data-tab="logs">Recent redirects</button>
        <span class="spacer"></span>
        <button class="btn btn-icon btn-sm btn-ghost" id="refresh" title="Refresh" aria-label="Refresh" style="align-self:center"></button>
      </div>
      <div id="content"><div class="loader"></div></div>
    </section>
  </main>

  <script>
    let data = { keys: [], logs: [] };
    let tab = 'keys';
    const content = X.$('#content');
    X.$('#refresh').innerHTML = X.icon('refresh', 'icon-sm');
    X.$('#createBtn').innerHTML = `${X.icon('plus', 'icon-sm')} Create`;

    /** Destination cell: a link only when the URL is plain http(s) */
    const urlCell = url => {
      const href = X.safeHref(url);
      return href === '#'
        ? X.truncCell(url)
        : `<a class="cell-trunc" href="${X.esc(href)}" target="_blank" rel="noopener noreferrer" title="${X.esc(url)}">${X.esc(url)}</a>`;
    };

    function render() {
      if (tab === 'keys') {
        X.table(content, [
          { label: 'Key', cls: 'mono', html: k => `<strong>${X.esc(k.key)}</strong>` },
          { label: 'Short link', html: k => `<a href="/${encodeURIComponent(k.key)}" target="_blank" rel="noopener">${X.esc(location.host)}/${X.esc(k.key)}</a>` },
          { label: 'Destination', html: k => urlCell(k.url) },
          { label: 'Clicks', th: 'num', cls: 'num', html: k => X.esc(k.count.toLocaleString()) },
          { label: '', cls: 'actions', html: k => `<div class="cell-actions">
              <button class="btn btn-sm" data-copy="${X.esc(k.key)}">${X.icon('copy', 'icon-sm')} Copy</button>
              <button class="btn btn-sm btn-danger" data-delete="${X.esc(k.key)}">${X.icon('trash', 'icon-sm')} Delete</button></div>` }
        ], data.keys, { empty: { icon: 'link', title: 'No short links yet', text: 'Create one above or from the public page.' } });
      } else {
        X.table(content, [
          { label: 'Time', html: l => X.timeCell(l.timestamp) },
          { label: 'Key', cls: 'mono', html: l => `<strong>${X.esc(l.key)}</strong>` },
          { label: 'Destination', html: l => urlCell(l.url) },
          { label: 'Client IP', html: l => X.ipBadge(l.ip) },
          { label: 'User agent', html: l => X.uaCell(l.userAgent) }
        ], data.logs, { empty: { icon: 'list', title: 'No redirects yet', text: 'Redirections will be recorded here.' } });
      }
    }

    content.addEventListener('click', async e => {
      const copyBtn = e.target.closest('[data-copy]');
      if (copyBtn) return X.copy(`${location.origin}/${copyBtn.dataset.copy}`, 'Short link copied');

      const delBtn = e.target.closest('[data-delete]');
      if (!delBtn) return;
      const key = delBtn.dataset.delete;
      if (!await X.confirm(`The short link “/${key}” will stop working immediately.`, { title: 'Delete this link?', confirmText: 'Delete' })) return;
      try {
        await X.api(`/admin/shortener/keys/${encodeURIComponent(key)}`, { method: 'DELETE' });
        X.toast(`Deleted “${key}”`);
        load();
      } catch (err) {
        X.toast(err.message, 'error');
      }
    });

    X.$$('.tab').forEach(t => t.addEventListener('click', () => {
      X.$$('.tab').forEach(x => x.classList.toggle('active', x === t));
      tab = t.dataset.tab;
      render();
    }));

    X.$('#createForm').addEventListener('submit', async e => {
      e.preventDefault();
      const keyEl = X.$('#createKey'), urlEl = X.$('#createUrl'), btn = X.$('#createBtn');
      const key = keyEl.value.trim(), url = urlEl.value.trim();
      keyEl.classList.toggle('error', !key);
      urlEl.classList.toggle('error', !url);
      if (!key || !url) return (key ? urlEl : keyEl).focus();

      btn.disabled = true;
      try {
        await X.api('/admin/shortener/keys', { method: 'POST', body: { key, url } });
        X.toast(`Short link “/${key}” created`);
        keyEl.value = urlEl.value = '';
        load();
      } catch (err) {
        if (err.status === 409 || err.status === 400) keyEl.classList.add('error');
        X.toast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    async function load() {
      await X.withBusy(X.$('#refresh'), async () => {
        try {
          data = await X.api('/admin/shortener/data');
          X.stats(X.$('#stats'), [
            { label: 'Total redirects', value: data.keys.reduce((s, k) => s + k.count, 0).toLocaleString(), tone: 'violet' },
            { label: 'Active links', value: data.keys.length.toLocaleString(), tone: 'pink' },
            { label: 'Recent redirects logged', value: data.logs.length.toLocaleString(), tone: 'sky' }
          ]);
          render();
        } catch (err) {
          content.innerHTML = '';
          X.toast(err.message, 'error');
        }
      });
    }

    X.$('#refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
