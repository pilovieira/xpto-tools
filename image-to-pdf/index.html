<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image to PDF — XPTO Tools</title>
  <meta name="description" content="Combine images into a single PDF.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .img-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .img-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
      transition: border-color .15s, opacity .15s;
    }
    .img-item.dragging { opacity: .4; }
    .img-item.drag-over { border-color: var(--accent); background: var(--accent-soft); }
    .grip { color: var(--faint); cursor: grab; }
    .img-order { width: 24px; text-align: center; font: 600 13px var(--mono); color: var(--muted); }
    .img-thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-2); background: var(--surface-3); }
    .img-meta { flex: 1; min-width: 0; }
    .img-name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .img-size { color: var(--muted); font-size: 12.5px; }
    .img-actions { display: flex; gap: 4px; }
  </style>
</head>
<body data-area="public" data-active="image-to-pdf">
  <main class="container narrow">
    <div data-page-head data-tool="image-to-pdf"></div>

    <section class="card stack">
      <label class="dropzone" id="dropZone">
        <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>
        <strong>Drop images here, or click to browse</strong>
        <span>PNG, JPG or WebP · multiple files allowed</span>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" multiple>
      </label>

      <div id="listSection" class="stack hidden">
        <div class="row between">
          <div class="card-title">Pages</div>
          <span class="badge badge-accent" id="count">0 images</span>
        </div>
        <ul class="img-list" id="list"></ul>

        <div class="row" style="padding-top:6px">
          <div class="field" style="flex:1; min-width:160px"><label for="pageSize">Page size</label>
            <select class="select" id="pageSize">
              <option value="a4">A4</option><option value="letter">Letter</option>
              <option value="a3">A3</option><option value="fit">Fit to image</option>
            </select>
          </div>
          <div class="field" style="flex:1; min-width:160px"><label for="orientation">Orientation</label>
            <select class="select" id="orientation">
              <option value="auto">Auto (per image)</option><option value="portrait">Portrait</option><option value="landscape">Landscape</option>
            </select>
          </div>
        </div>

        <div id="progressWrap" class="stack hidden" style="gap:8px">
          <div class="muted" id="progressLabel" style="font-size:13px">Processing…</div>
          <div class="progress"><i id="progressBar"></i></div>
        </div>

        <div class="row">
          <button class="btn btn-primary btn-lg" id="generateBtn"></button>
          <button class="btn" id="addMoreBtn"></button>
          <span class="spacer"></span>
          <button class="btn btn-danger" id="clearBtn"></button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const { jsPDF } = window.jspdf;
    const PAGE_SIZES = { a4: [595.28, 841.89], letter: [612, 792], a3: [841.89, 1190.55] };

    let images = []; // { file, url, name, size }
    let dragSrc = null;

    const fileInput = X.$('#fileInput');
    const dropZone = X.$('#dropZone');
    const listSection = X.$('#listSection');
    const list = X.$('#list');
    const generateBtn = X.$('#generateBtn');

    generateBtn.innerHTML = `${X.icon('download', 'icon-sm')} Generate PDF`;
    X.$('#addMoreBtn').innerHTML = `${X.icon('plus', 'icon-sm')} Add more`;
    X.$('#clearBtn').innerHTML = `${X.icon('trash', 'icon-sm')} Clear all`;

    /* ── Adding files ── */
    fileInput.addEventListener('change', e => { addFiles(e.target.files); fileInput.value = ''; });
    X.$('#addMoreBtn').addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
    dropZone.addEventListener('drop', e => addFiles(e.dataTransfer.files));

    function addFiles(fileList) {
      const valid = [...fileList].filter(f => f.type.startsWith('image/'));
      if (!valid.length) return X.toast('No valid image files found.', 'error');
      valid.forEach(f => images.push({ file: f, url: URL.createObjectURL(f), name: f.name, size: f.size }));
      render();
    }

    X.$('#clearBtn').addEventListener('click', () => {
      images.forEach(i => URL.revokeObjectURL(i.url));
      images = [];
      render();
    });

    /* ── List ── */
    function render() {
      listSection.classList.toggle('hidden', images.length === 0);
      X.$('#count').textContent = images.length === 1 ? '1 image' : `${images.length} images`;
      list.innerHTML = images.map((img, i) => `
        <li class="img-item" draggable="true" data-i="${i}">
          <span class="grip" title="Drag to reorder">${X.icon('grip')}</span>
          <span class="img-order">${i + 1}</span>
          <img class="img-thumb" src="${img.url}" alt="">
          <div class="img-meta"><div class="img-name" title="${X.esc(img.name)}">${X.esc(img.name)}</div><div class="img-size">${X.fmtBytes(img.size)}</div></div>
          <div class="img-actions">
            <button class="btn btn-ghost btn-icon btn-sm" data-act="up" title="Move up" ${i === 0 ? 'disabled' : ''}>${X.icon('up', 'icon-sm')}</button>
            <button class="btn btn-ghost btn-icon btn-sm" data-act="down" title="Move down" ${i === images.length - 1 ? 'disabled' : ''}>${X.icon('down', 'icon-sm')}</button>
            <button class="btn btn-danger btn-icon btn-sm" data-act="remove" title="Remove">${X.icon('x', 'icon-sm')}</button>
          </div>
        </li>`).join('');
    }

    const move = (from, to) => { images.splice(to, 0, images.splice(from, 1)[0]); render(); };

    list.addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const i = +btn.closest('.img-item').dataset.i;
      if (btn.dataset.act === 'up') move(i, i - 1);
      else if (btn.dataset.act === 'down') move(i, i + 1);
      else { URL.revokeObjectURL(images[i].url); images.splice(i, 1); render(); }
    });

    const clearDragOver = () => X.$$('.img-item', list).forEach(el => el.classList.remove('drag-over'));
    list.addEventListener('dragstart', e => { const li = e.target.closest('.img-item'); if (!li) return; dragSrc = +li.dataset.i; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    list.addEventListener('dragend', e => { e.target.closest('.img-item')?.classList.remove('dragging'); clearDragOver(); });
    list.addEventListener('dragover', e => { const li = e.target.closest('.img-item'); if (!li || dragSrc === null) return; e.preventDefault(); clearDragOver(); li.classList.add('drag-over'); });
    list.addEventListener('drop', e => {
      const li = e.target.closest('.img-item');
      if (!li || dragSrc === null) return;
      e.preventDefault();
      const to = +li.dataset.i;
      if (to !== dragSrc) move(dragSrc, to);
      dragSrc = null;
    });

    /* ── PDF generation ── */
    /** Decode an image and flatten it onto white (JPEG has no alpha) */
    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          resolve({ data: canvas.toDataURL('image/jpeg', 0.95), w: img.naturalWidth, h: img.naturalHeight });
        };
        img.onerror = () => reject(new Error('Could not decode an image'));
        img.src = url;
      });
    }

    const tick = () => new Promise(r => setTimeout(r, 0));

    generateBtn.addEventListener('click', async () => {
      if (!images.length) return;
      const size = X.$('#pageSize').value;
      const orientPref = X.$('#orientation').value;
      const wrap = X.$('#progressWrap');
      const bar = X.$('#progressBar');

      generateBtn.disabled = true;
      wrap.classList.remove('hidden');
      bar.style.width = '0%';

      try {
        let doc = null;
        for (let i = 0; i < images.length; i++) {
          X.$('#progressLabel').textContent = `Processing image ${i + 1} of ${images.length}…`;
          bar.style.width = `${(i / images.length) * 90}%`;

          const { data, w, h } = await loadImage(images[i].url);
          const orientation = orientPref === 'auto' ? (w >= h ? 'landscape' : 'portrait') : orientPref;

          // Page dimensions in points (96dpi px → 72dpi pt for "fit")
          let [pw, ph] = size === 'fit' ? [w * 0.75, h * 0.75] : PAGE_SIZES[size];
          [pw, ph] = orientation === 'landscape' ? [Math.max(pw, ph), Math.min(pw, ph)] : [Math.min(pw, ph), Math.max(pw, ph)];

          const margin = size === 'fit' ? 0 : 20;
          const scale = Math.min((pw - margin * 2) / w, (ph - margin * 2) / h);
          const dw = w * scale, dh = h * scale;

          if (!doc) doc = new jsPDF({ orientation, unit: 'pt', format: [pw, ph] });
          else doc.addPage([pw, ph], orientation);
          doc.addImage(data, 'JPEG', (pw - dw) / 2, (ph - dh) / 2, dw, dh);
          await tick();
        }

        bar.style.width = '100%';
        X.$('#progressLabel').textContent = 'Saving PDF…';
        await tick();
        doc.save(`images-${Date.now()}.pdf`);
        X.toast(`PDF saved — ${images.length} page${images.length > 1 ? 's' : ''}`);
      } catch (err) {
        console.error(err);
        X.toast(err.message || 'Something went wrong. Please try again.', 'error');
      } finally {
        generateBtn.disabled = false;
        setTimeout(() => wrap.classList.add('hidden'), 800);
      }
    });
  </script>
</body>
</html>
