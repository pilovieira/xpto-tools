<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — XPTO Tools</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
</head>
<body data-area="auth">
  <div class="auth-wrap">
    <div class="auth-card card stack" style="gap:22px">
      <div class="stack" style="gap:14px">
        <a class="brand" href="/"><span class="brand-mark">X</span><span>XPTO <small>Admin</small></span></a>
        <div>
          <h1>Welcome back</h1>
          <p class="muted">Sign in to manage your tools.</p>
        </div>
      </div>

      <div id="error" class="alert hidden" role="alert"></div>

      <form id="loginForm" class="stack">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" required placeholder="admin@example.com" autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="submitBtn">Sign in</button>
      </form>

      <a class="muted" href="/" style="font-size:14px; text-align:center">← Back to tools</a>
    </div>
  </div>

  <div style="position:fixed; top:14px; right:14px"><button class="btn btn-ghost btn-icon" id="theme" aria-label="Toggle theme"></button></div>

  <script>
    const root = document.documentElement;
    const themeBtn = X.$('#theme');
    const paint = () => { themeBtn.innerHTML = X.icon(root.dataset.theme === 'light' ? 'moon' : 'sun'); };
    paint();
    themeBtn.addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('xpto-theme', root.dataset.theme); } catch { /* storage unavailable */ }
      paint();
    });

    const errorBox = X.$('#error');
    const submitBtn = X.$('#submitBtn');

    X.$('#loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying…';
      try {
        await X.api('/admin/login', { method: 'POST', body: { email: X.$('#email').value, password: X.$('#password').value } });
        location.href = '/admin';
      } catch (err) {
        errorBox.textContent = err.status === 401 ? 'Invalid email or password.' : err.message;
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
