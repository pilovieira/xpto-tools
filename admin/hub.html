<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — XPTO Tools</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
</head>
<body data-area="admin" data-active="hub">
  <main class="container">
    <div data-page-head data-title="Admin overview" data-desc="Usage logs, links and stored files for every tool." data-icon="shield" data-tone="violet"></div>
    <section class="tool-grid" id="grid"></section>
  </main>

  <script>
    X.$('#grid').innerHTML = X.TOOLS.filter(t => t.admin).map(t => `
      <a class="tool-card tone-${t.tone}" href="${t.admin}">
        <div class="page-icon">${X.icon(t.icon)}</div>
        <h3>${X.esc(t.name)}</h3>
        <p>${X.esc(t.adminDesc)}</p>
        <span class="cta">Open dashboard ${X.icon('arrow', 'icon-sm')}</span>
      </a>`).join('');
  </script>
</body>
</html>
