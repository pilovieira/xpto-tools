<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XPTO Tools</title>
  <meta name="description" content="XPTO Tools — small, fast developer utilities: URL shortener, Base58, tokens and PDF tools.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
</head>
<body data-area="public" data-active="home">
  <main class="container">
    <section class="hero">
      <span class="eyebrow">Developer toolbox</span>
      <h1>Small tools,<br><em>sharp results.</em></h1>
      <p>Fast, no-nonsense utilities for everyday work. Most of them run entirely in your browser.</p>
      <div class="input-group">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" id="search" type="search" placeholder="Search tools…" autocomplete="off" aria-label="Search tools">
      </div>
    </section>

    <section class="tool-grid" id="grid"></section>
    <div class="empty hidden" id="none"><strong>No tools match your search</strong>Try a different keyword.</div>
  </main>

  <script>
    const grid = X.$('#grid');
    const none = X.$('#none');

    function render(query = '') {
      const q = query.trim().toLowerCase();
      const list = X.TOOLS.filter(t => !q || [t.name, t.desc, ...t.chips].join(' ').toLowerCase().includes(q));
      grid.innerHTML = list.map(t => `
        <a class="tool-card tone-${t.tone}" href="${t.href}">
          <div class="page-icon">${X.icon(t.icon)}</div>
          <div>
            <h3>${X.esc(t.name)}</h3>
          </div>
          <p>${X.esc(t.desc)}</p>
          <div class="chips">${t.chips.map(c => `<span class="chip">${X.esc(c)}</span>`).join('')}</div>
          <span class="cta">Open ${X.icon('arrow', 'icon-sm')}</span>
        </a>`).join('');
      none.classList.toggle('hidden', list.length > 0);
    }

    X.$('#search').addEventListener('input', e => render(e.target.value));
    render();
  </script>
</body>
</html>
