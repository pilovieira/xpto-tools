<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPTO - PDF Splitter</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Load pdf-lib and JSZip from CDNs -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-teal: #14b8a6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glass-bg: rgba(17, 24, 39, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.12) 0px, transparent 40%),
        radial-gradient(at 100% 100%, rgba(20, 184, 166, 0.1) 0px, transparent 40%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .logo-section {
      display: flex;
      flex-direction: column;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #a78bfa 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 10px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .nav-btn:hover {
      background: rgba(139, 92, 246, 0.1);
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
    }

    /* Splitter Container */
    .tool-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .tool-title {
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tool-title::before {
      content: '🥞';
      font-size: 26px;
    }

    /* Drag & Drop */
    .drop-zone {
      border: 2px dashed rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 50px 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent-purple);
      background: rgba(139, 92, 246, 0.05);
    }

    .drop-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
      transition: transform 0.3s ease;
    }

    .drop-zone:hover .drop-icon {
      transform: translateY(-5px);
    }

    .drop-text {
      font-size: 16px;
      color: var(--text-main);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .drop-subtext {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Hidden File Input */
    #fileInput {
      display: none;
    }

    /* Uploading State */
    .status-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      color: var(--accent-teal);
      padding: 12px;
      background: rgba(20, 184, 166, 0.1);
      border: 1px solid rgba(20, 184, 166, 0.2);
      border-radius: 8px;
      display: none;
    }

    /* PDF Info & General Actions */
    .pdf-info-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .pdf-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pdf-filename {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    .pdf-details {
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-action {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Grid of Pages */
    .pages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .page-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: all 0.3s ease;
      text-align: center;
    }

    .page-card:hover {
      border-color: rgba(139, 92, 246, 0.3);
      background: rgba(139, 92, 246, 0.02);
      transform: translateY(-2px);
    }

    .page-thumbnail {
      width: 80px;
      height: 105px;
      background: rgba(139, 92, 246, 0.1);
      border: 1.5px solid rgba(139, 92, 246, 0.2);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .page-thumbnail-number {
      font-size: 24px;
      font-weight: 700;
      color: #c4b5fd;
    }

    .page-thumbnail-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .page-number-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
    }

    .btn-download-page {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      color: var(--text-main);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .btn-download-page:hover {
      background: rgba(139, 92, 246, 0.15);
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #111827;
      border: 1px solid var(--glass-border);
      border-left: 4px solid var(--success);
      padding: 16px 24px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-danger {
      border-left-color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <a href="/" class="logo-section" style="text-decoration: none;">
        <div class="logo-text">XPTO</div>
        <div class="subtitle">PDF Page Splitter Utility</div>
      </a>
      <div id="nav-buttons" style="display: flex; gap: 12px;"></div>
    </div>

    <div class="tool-card">
      <div class="tool-title">PDF Splitter</div>

      <!-- Drag & Drop Zone -->
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <span class="drop-icon">📂</span>
        <div class="drop-text">Drag & drop your PDF here, or click to browse</div>
        <div class="drop-subtext">Supports PDF files up to 50MB</div>
        <input type="file" id="fileInput" accept="application/pdf">
      </div>

      <!-- Uploading / Processing Status -->
      <div class="status-msg" id="statusMsg">
        <span class="spinner">⏳</span>
        <span id="statusText">Uploading original PDF and splitting pages...</span>
      </div>

      <!-- PDF Meta & Download All -->
      <div class="pdf-info-bar" id="pdfInfoBar">
        <div class="pdf-meta">
          <div class="pdf-filename" id="pdfFilename">document.pdf</div>
          <div class="pdf-details" id="pdfDetails">3 pages | 1.2 MB</div>
        </div>
        <button class="btn-action" id="btnDownloadAll" onclick="downloadAllAsZip()">
          <span>📦</span> Download All as ZIP
        </button>
      </div>

      <!-- Grid of Split Pages -->
      <div class="pages-grid" id="pagesGrid"></div>
    </div>
  </div>

  <!-- Toast Element -->
  <div id="toast" class="toast">Successfully completed!</div>

  <script>
    let currentPdfBytes = null;
    let currentFilename = "";
    let splitPages = []; // Holds uint8 arrays of single-page PDFs

    // Setup drag and drop
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length) {
        handleFileSelect(files[0]);
      }
    }, false);

    fileInput.addEventListener('change', (e) => {
      if (fileInput.files.length) {
        handleFileSelect(fileInput.files[0]);
      }
    });

    function showToast(message, isDanger = false) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      if (isDanger) {
        toast.classList.add('toast-danger');
      } else {
        toast.classList.remove('toast-danger');
      }
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    async function handleFileSelect(file) {
      if (file.type !== 'application/pdf') {
        showToast('Please select a valid PDF file.', true);
        return;
      }

      currentFilename = file.name;
      const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
      
      // Update UI state
      document.getElementById('statusMsg').style.display = 'flex';
      document.getElementById('statusText').innerText = "Reading PDF file...";
      document.getElementById('pdfInfoBar').style.display = 'none';
      document.getElementById('pagesGrid').innerHTML = '';

      try {
        const reader = new FileReader();
        reader.onload = async function() {
          try {
            const arrayBuffer = this.result;
            currentPdfBytes = new Uint8Array(arrayBuffer);

            // 1. Upload to server first (as base64 string)
            document.getElementById('statusText').innerText = "Uploading original PDF to server...";
            const base64Data = arrayBufferToBase64(currentPdfBytes);
            const uploadResponse = await fetch('/pdf-splitter/upload', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ filename: currentFilename, fileData: base64Data })
            });

            if (!uploadResponse.ok) {
              const errData = await uploadResponse.json();
              throw new Error(errData.fail || 'Failed to upload PDF');
            }

            // 2. Perform splitting locally in the browser
            document.getElementById('statusText').innerText = "Splitting PDF into pages...";
            const pdfDoc = await PDFLib.PDFDocument.load(currentPdfBytes);
            const pageCount = pdfDoc.getPageCount();

            if (pageCount === 0) {
              throw new Error("This PDF has no pages.");
            }

            splitPages = [];
            const pagesGrid = document.getElementById('pagesGrid');

            for (let i = 0; i < pageCount; i++) {
              const newDoc = await PDFLib.PDFDocument.create();
              const [copiedPage] = await newDoc.copyPages(pdfDoc, [i]);
              newDoc.addPage(copiedPage);
              const pdfBytes = await newDoc.save();
              splitPages.push(pdfBytes);

              // Render page card
              const card = document.createElement('div');
              card.className = 'page-card';
              card.innerHTML = `
                <div class="page-thumbnail">
                  <div class="page-thumbnail-number">${i + 1}</div>
                  <div class="page-thumbnail-label">Page</div>
                </div>
                <div class="page-number-title">Page ${i + 1}</div>
                <button class="btn-download-page" onclick="downloadPage(${i})">Download</button>
              `;
              pagesGrid.appendChild(card);
            }

            // Show info bar
            document.getElementById('pdfFilename').innerText = currentFilename;
            document.getElementById('pdfDetails').innerText = `${pageCount} page${pageCount > 1 ? 's' : ''} | ${sizeMB} MB`;
            document.getElementById('pdfInfoBar').style.display = 'flex';
            document.getElementById('statusMsg').style.display = 'none';

            showToast('PDF successfully split!');
          } catch (e) {
            console.error(e);
            document.getElementById('statusMsg').style.display = 'none';
            showToast('Error processing PDF: ' + e.message, true);
          }
        };
        reader.readAsArrayBuffer(file);
      } catch (err) {
        console.error(err);
        document.getElementById('statusMsg').style.display = 'none';
        showToast('Error loading file.', true);
      }
    }

    function downloadPage(index) {
      const bytes = splitPages[index];
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      const baseName = currentFilename.replace(/\.pdf$/i, '');
      link.href = window.URL.createObjectURL(blob);
      link.download = `${baseName}_page_${index + 1}.pdf`;
      link.click();
    }

    async function downloadAllAsZip() {
      if (splitPages.length === 0) return;
      const zip = new JSZip();
      const baseName = currentFilename.replace(/\.pdf$/i, '');

      splitPages.forEach((bytes, idx) => {
        zip.file(`${baseName}_page_${idx + 1}.pdf`, bytes);
      });

      try {
        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(content);
        link.download = `${baseName}_split_pages.zip`;
        link.click();
        showToast('ZIP download started!');
      } catch (err) {
        showToast('Failed to generate ZIP: ' + err.message, true);
      }
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const navButtons = document.getElementById('nav-buttons');
      const isLoggedIn = document.cookie.split(';').some(item => item.trim().startsWith('admin_token='));
      if (isLoggedIn) {
        navButtons.innerHTML = `
          <a href="/admin" class="nav-btn">Admin Hub</a>
          <a href="/admin/logout" class="nav-btn" style="border-color: rgba(239, 68, 68, 0.2); color: var(--danger);">Logout</a>
        `;
      } else {
        navButtons.innerHTML = `
          <a href="/admin" class="nav-btn">Admin Login</a>
        `;
      }
    });
  </script>
</body>
</html>
