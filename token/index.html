<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XPTO - Token Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-teal: #14b8a6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glass-bg: rgba(17, 24, 39, 0.7);
      --glass-border: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.12) 0px, transparent 40%),
        radial-gradient(at 100% 100%, rgba(20, 184, 166, 0.1) 0px, transparent 40%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--glass-border);
    }

    .logo-section {
      display: flex;
      flex-direction: column;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #a78bfa 0%, #f472b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 10px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .nav-btn:hover {
      background: rgba(139, 92, 246, 0.1);
      border-color: rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
    }

    /* Grid Layout */
    .tools-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 32px;
    }

    @media (max-width: 900px) {
      .tools-grid {
        grid-template-columns: 1fr;
      }
    }

    .tool-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .tool-title {
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tool-title::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .config-title::before { background: var(--accent-purple); }
    .output-title::before { background: var(--accent-pink); }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input[type="text"], input[type="number"], select {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
      width: 100%;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    /* Slider styling */
    .range-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-purple);
      height: 5px;
      cursor: pointer;
    }

    .range-val {
      font-size: 14px;
      font-weight: 600;
      color: #c4b5fd;
      min-width: 30px;
      text-align: right;
    }

    /* Toggles Grid */
    .toggle-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 6px;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      color: var(--text-muted);
      padding: 8px 4px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .toggle-btn:hover {
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
    }

    .toggle-btn.active {
      background: rgba(139, 92, 246, 0.15);
      border-color: var(--accent-purple);
      color: #c4b5fd;
    }

    .btn-action {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
      text-align: center;
    }

    .btn-action:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Output Toolbar */
    .output-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--glass-border);
      flex-wrap: wrap;
      gap: 12px;
    }

    .toolbar-stats {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .toolbar-stats span strong {
      color: var(--text-main);
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      color: var(--text-main);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(139, 92, 246, 0.1);
      border-color: rgba(139, 92, 246, 0.3);
    }

    /* Tokens Area */
    .tokens-container {
      min-height: 300px;
      display: flex;
      flex-direction: column;
    }

    .tokens-grid {
      display: grid;
      gap: 8px;
    }

    .tokens-grid.layout-list { grid-template-columns: 1fr; }
    .tokens-grid.layout-2col { grid-template-columns: repeat(2, 1fr); }
    .tokens-grid.layout-3col { grid-template-columns: repeat(3, 1fr); }

    @media (max-width: 600px) {
      .tokens-grid.layout-2col, .tokens-grid.layout-3col {
        grid-template-columns: 1fr;
      }
    }

    .token-item {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .token-item:hover {
      border-color: rgba(139, 92, 246, 0.3);
      background: rgba(139, 92, 246, 0.02);
    }

    .token-index {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .token-value {
      font-family: monospace;
      font-size: 13px;
      color: var(--text-main);
      word-break: break-all;
      flex: 1;
    }

    .token-copy-hint {
      font-size: 10px;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .token-item:hover .token-copy-hint {
      opacity: 1;
    }

    .token-item.flash {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 40px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.3; }
    .empty-text { font-size: 14px; }

    /* Footer */
    .footer-desc {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 16px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #111827;
      border: 1px solid var(--glass-border);
      border-left: 4px solid var(--success);
      padding: 16px 24px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <a href="/" class="logo-section" style="text-decoration: none;">
        <div class="logo-text">XPTO</div>
        <div class="subtitle">Secure Client-Side Token Generator</div>
      </a>
      <div id="nav-buttons" style="display: flex; gap: 12px;"></div>
    </div>

    <div class="tools-grid">
      <!-- Config Panel -->
      <div class="tool-card">
        <div class="tool-title config-title">Configuration</div>

        <div class="form-group">
          <label>Token Type</label>
          <div class="toggle-grid">
            <button class="toggle-btn active" data-type="hex">Hex</button>
            <button class="toggle-btn" data-type="base64">Base64</button>
            <button class="toggle-btn" data-type="base62">Base62</button>
            <button class="toggle-btn" data-type="uuid">UUID v4</button>
            <button class="toggle-btn" data-type="numeric">Numeric</button>
            <button class="toggle-btn" data-type="alphanumeric">Alphanum</button>
          </div>
        </div>

        <div class="form-group" id="length-section">
          <label>Length</label>
          <div class="range-row">
            <input type="range" id="length" min="8" max="128" value="32" step="1">
            <span class="range-val" id="length-display">32</span>
          </div>
        </div>

        <div class="form-group">
          <label>Quantity</label>
          <div class="range-row">
            <input type="range" id="quantity" min="1" max="100" value="10" step="1">
            <span class="range-val" id="quantity-display">10</span>
          </div>
        </div>

        <div class="form-group">
          <label>Prefix</label>
          <input type="text" id="prefix" placeholder="e.g. tok_">
        </div>

        <div class="form-group">
          <label>Separator</label>
          <div class="toggle-grid">
            <button class="toggle-btn active" data-sep="none">None</button>
            <button class="toggle-btn" data-sep="-">Dash (-)</button>
            <button class="toggle-btn" data-sep="_">Underscore (_)</button>
            <button class="toggle-btn" data-sep=".">Dot (.)</button>
          </div>
        </div>

        <div class="form-group" id="group-field">
          <label>Group Every</label>
          <div class="range-row">
            <input type="range" id="group-size" min="0" max="16" value="0" step="1">
            <span class="range-val" id="group-display">off</span>
          </div>
        </div>

        <button class="btn-action" id="generate-btn">Generate Tokens</button>
      </div>

      <!-- Output Panel -->
      <div class="tool-card">
        <div class="tool-title output-title">Generated Tokens</div>

        <div class="tokens-container">
          <div class="output-toolbar" id="outputToolbar" style="display: none;">
            <div class="toolbar-stats">
              <span>Type: <strong id="stat-type">hex</strong></span>
              <span>Length: <strong id="stat-length">—</strong></span>
            </div>
            <div class="toolbar-actions">
              <button class="btn-secondary" id="copy-all-btn">Copy All</button>
              <button class="btn-secondary" id="download-btn">Download</button>
            </div>
          </div>

          <div class="empty-state" id="empty-state">
            <div class="empty-icon">⚙️</div>
            <div class="empty-text">Configure parameters and click generate to produce tokens</div>
          </div>

          <div class="tokens-grid layout-list" id="tokens-grid" style="display: none; margin-top: 20px;"></div>
        </div>

        <div class="footer-desc" id="gen-time">All generation happens securely in your browser</div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    const state = {
      type: 'hex',
      length: 32,
      quantity: 10,
      prefix: '',
      separator: 'none',
      groupSize: 0,
      tokens: []
    };

    function getEl(id) { return document.getElementById(id); }

    // Type toggles
    document.querySelectorAll('[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.type = btn.dataset.type;
        const isUuid = state.type === 'uuid';
        getEl('length-section').style.opacity = isUuid ? '0.4' : '1';
        getEl('length-section').style.pointerEvents = isUuid ? 'none' : '';
      });
    });

    // Sep toggles
    document.querySelectorAll('[data-sep]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-sep]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.separator = btn.dataset.sep;
      });
    });

    // Sliders
    function bindSlider(id, displayId, key, fmt) {
      const el = getEl(id);
      const disp = getEl(displayId);
      el.addEventListener('input', () => {
        state[key] = parseInt(el.value);
        disp.textContent = fmt ? fmt(state[key]) : state[key];
      });
    }

    bindSlider('length', 'length-display', 'length');
    bindSlider('quantity', 'quantity-display', 'quantity');
    bindSlider('group-size', 'group-display', 'groupSize', v => v === 0 ? 'off' : v);

    getEl('prefix').addEventListener('input', e => { state.prefix = e.target.value; });

    // Token generation
    const CHARSETS = {
      hex: '0123456789abcdef',
      base62: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
      alphanumeric: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
      numeric: '0123456789',
    };

    function randomBytes(n) {
      const arr = new Uint8Array(n);
      crypto.getRandomValues(arr);
      return arr;
    }

    function generateFromCharset(charset, length) {
      const bytes = randomBytes(length);
      return Array.from(bytes).map(b => charset[b % charset.length]).join('');
    }

    function generateBase64(length) {
      const bytes = randomBytes(Math.ceil(length * 3 / 4));
      const b64 = btoa(String.fromCharCode(...bytes))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
      return b64.slice(0, length);
    }

    function generateUUID() {
      return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
      );
    }

    function generateToken() {
      let raw;
      const len = state.length;

      if (state.type === 'uuid') {
        raw = generateUUID();
      } else if (state.type === 'base64') {
        raw = generateBase64(len);
      } else {
        raw = generateFromCharset(CHARSETS[state.type] || CHARSETS.hex, len);
      }

      let formatted = raw;
      if (state.separator !== 'none' && state.groupSize > 0 && state.type !== 'uuid') {
        const sep = state.separator;
        const gs = state.groupSize;
        const parts = [];
        for (let i = 0; i < formatted.length; i += gs) {
          parts.push(formatted.slice(i, i + gs));
        }
        formatted = parts.join(sep);
      }

      return state.prefix + formatted;
    }

    function applyLayout(tokens) {
      const avgLen = tokens[0] ? tokens[0].length : 32;
      const grid = getEl('tokens-grid');
      grid.className = 'tokens-grid ' + (avgLen <= 16 ? 'layout-3col' : avgLen <= 32 ? 'layout-2col' : 'layout-list');
    }

    function renderTokens() {
      const grid = getEl('tokens-grid');
      const empty = getEl('empty-state');
      const toolbar = getEl('outputToolbar');
      const tokens = state.tokens;

      if (!tokens.length) {
        empty.style.display = 'flex';
        grid.style.display = 'none';
        toolbar.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      grid.style.display = 'grid';
      toolbar.style.display = 'flex';
      applyLayout(tokens);

      grid.innerHTML = tokens.map((t, i) => `
        <div class="token-item" data-token="${escHtml(t)}" onclick="copyToken(this)">
          <span class="token-index">${String(i + 1).padStart(2, '0')}</span>
          <span class="token-value">${escHtml(t)}</span>
          <span class="token-copy-hint">Copy</span>
        </div>
      `).join('');

      // Update stats
      getEl('stat-type').textContent = state.type;
      getEl('stat-length').textContent = state.type === 'uuid' ? '36 (UUID)' : tokens[0].length + ' Chars';
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showToast(msg) {
      const t = getEl('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    window.copyToken = function(el) {
      const token = el.dataset.token;
      navigator.clipboard.writeText(token).then(() => {
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 400);
        showToast('Token copied to clipboard!');
      });
    };

    getEl('generate-btn').addEventListener('click', () => {
      const t0 = performance.now();
      state.tokens = Array.from({ length: state.quantity }, generateToken);
      const ms = (performance.now() - t0).toFixed(1);
      renderTokens();
      getEl('gen-time').textContent = `Generated ${state.quantity} tokens in ${ms}ms (Secure Browser-Side)`;
    });

    getEl('copy-all-btn').addEventListener('click', () => {
      if (!state.tokens.length) return;
      navigator.clipboard.writeText(state.tokens.join('\n')).then(() => {
        showToast('All tokens copied to clipboard!');
      });
    });

    getEl('download-btn').addEventListener('click', () => {
      if (!state.tokens.length) return;
      const blob = new Blob([state.tokens.join('\n')], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tokens-${state.type}-${Date.now()}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Tokens file downloaded!');
    });

    document.addEventListener('DOMContentLoaded', () => {
      const navButtons = document.getElementById('nav-buttons');
      const isLoggedIn = document.cookie.split(';').some(item => item.trim().startsWith('admin_token='));
      if (isLoggedIn) {
        navButtons.innerHTML = `
          <a href="/admin" class="nav-btn">Admin Hub</a>
          <a href="/admin/logout" class="nav-btn" style="border-color: rgba(239, 68, 68, 0.2); color: var(--danger);">Logout</a>
        `;
      } else {
        navButtons.innerHTML = `
          <a href="/admin" class="nav-btn">Admin Login</a>
        `;
      }
    });
  </script>
</body>
</html>
