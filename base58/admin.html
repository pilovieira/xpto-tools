<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Base58 Admin — XPTO Tools</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
</head>
<body data-area="admin" data-active="base58">
  <main class="container wide">
    <div data-page-head data-tool="base58"></div>
    <div id="stats"></div>

    <section class="card flush">
      <div class="toolbar">
        <div class="input-group">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input class="input" id="search" type="search" placeholder="Search IP, input, output or user agent…" autocomplete="off">
        </div>
        <select class="select" id="typeFilter">
          <option value="all">All operations</option>
          <option value="encode">Encode only</option>
          <option value="decode">Decode only</option>
        </select>
        <button class="btn btn-icon" id="refresh" title="Refresh" aria-label="Refresh"></button>
      </div>
      <div id="content"><div class="loader"></div></div>
    </section>
  </main>

  <script>
    let allLogs = [];
    const content = X.$('#content');
    X.$('#refresh').innerHTML = X.icon('refresh');

    function render() {
      const q = X.$('#search').value.toLowerCase();
      const type = X.$('#typeFilter').value;
      const rows = allLogs.filter(l => (type === 'all' || l.type === type) &&
        (!q || [l.ip, l.input, l.output, l.userAgent, l.type].join(' ').toLowerCase().includes(q)));

      X.table(content, [
        { label: 'Time', html: l => X.timeCell(l.timestamp) },
        { label: 'Type', html: l => `<span class="badge ${l.type === 'encode' ? 'badge-accent' : 'badge-info'}">${X.esc(l.type)}</span>` },
        { label: 'Input', html: l => X.truncCell(l.input, true) },
        { label: 'Output', html: l => X.truncCell(l.output, true) },
        { label: 'Client IP', html: l => X.ipBadge(l.ip) },
        { label: 'User agent', html: l => X.uaCell(l.userAgent) }
      ], rows, { empty: { icon: 'repeat', title: 'No operations found', text: 'Nothing matches the current filter.' }, onRowClick: openDetail });
    }

    function openDetail(l) {
      const field = (label, value) => `<div><div class="kv-label">${label}</div><div class="kv-value">${X.esc(value || '—')}</div></div>`;
      X.modal({
        title: `${l.type === 'encode' ? 'Encode' : 'Decode'} operation`,
        body: field('Timestamp', X.fmtDate(l.timestamp)) + field('Input', l.input) + field('Output', l.output) + field('Client IP', l.ip) + field('User agent', l.userAgent)
      });
    }

    async function load() {
      await X.withBusy(X.$('#refresh'), async () => {
        try {
          allLogs = (await X.api('/admin/base58/data')).logs || [];
          const enc = allLogs.filter(l => l.type === 'encode').length;
          X.stats(X.$('#stats'), [
            { label: 'Total operations', value: allLogs.length.toLocaleString(), tone: 'violet' },
            { label: 'Encodes', value: enc.toLocaleString(), tone: 'pink' },
            { label: 'Decodes', value: (allLogs.length - enc).toLocaleString(), tone: 'sky' }
          ]);
          render();
        } catch (err) {
          content.innerHTML = '';
          X.toast(err.message, 'error');
        }
      });
    }

    X.$('#search').addEventListener('input', render);
    X.$('#typeFilter').addEventListener('change', render);
    X.$('#refresh').addEventListener('click', load);
    load();
  </script>
</body>
</html>
