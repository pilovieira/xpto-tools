<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Base58 Converter — XPTO Tools</title>
  <meta name="description" content="Encode text to Base58 and decode Base58 back to text.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
</head>
<body data-area="public" data-active="base58">
  <main class="container">
    <div data-page-head data-tool="base58"></div>

    <div class="grid grid-2">
      <section class="card stack">
        <div class="card-head" style="margin:0">
          <div><div class="card-title">Encode</div><div class="card-sub">Plain text → Base58</div></div>
          <span class="badge badge-accent">UTF-8</span>
        </div>
        <div class="field">
          <label for="encodeInput">Source text</label>
          <textarea class="textarea" id="encodeInput" placeholder="Type or paste text to encode…" spellcheck="false"></textarea>
        </div>
        <button class="btn btn-primary" id="encodeBtn">Encode to Base58</button>
        <div class="field">
          <label>Base58 output</label>
          <div class="output" id="encodeOut"><span class="placeholder">Output will appear here…</span></div>
        </div>
      </section>

      <section class="card stack">
        <div class="card-head" style="margin:0">
          <div><div class="card-title">Decode</div><div class="card-sub">Base58 → plain text</div></div>
          <span class="badge badge-accent">Bitcoin alphabet</span>
        </div>
        <div class="field">
          <label for="decodeInput">Base58 string</label>
          <textarea class="textarea" id="decodeInput" placeholder="Paste a Base58 string to decode…" spellcheck="false"></textarea>
        </div>
        <button class="btn btn-primary" id="decodeBtn">Decode Base58</button>
        <div class="field">
          <label>Decoded text</label>
          <div class="output" id="decodeOut"><span class="placeholder">Output will appear here…</span></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    const ALPHABET_MAP = Object.fromEntries([...ALPHABET].map((c, i) => [c, i]));

    function encodeBase58(buffer) {
      if (buffer.length === 0) return '';
      const digits = [0];
      for (let i = 0; i < buffer.length; i++) {
        for (let j = 0; j < digits.length; j++) digits[j] <<= 8;
        digits[0] += buffer[i];
        let carry = 0;
        for (let j = 0; j < digits.length; ++j) {
          digits[j] += carry;
          carry = (digits[j] / 58) | 0;
          digits[j] %= 58;
        }
        while (carry > 0) {
          digits.push(carry % 58);
          carry = (carry / 58) | 0;
        }
      }
      for (let i = 0; i < buffer.length - 1 && buffer[i] === 0; i++) digits.push(0);
      return digits.reverse().map(d => ALPHABET.charAt(d)).join('');
    }

    function decodeBase58(string) {
      if (string.length === 0) return new Uint8Array(0);
      const bytes = [0];
      for (let i = 0; i < string.length; i++) {
        const c = string.charAt(i);
        if (!(c in ALPHABET_MAP)) throw new Error('Non-Base58 character: ' + c);
        for (let j = 0; j < bytes.length; j++) bytes[j] *= 58;
        bytes[0] += ALPHABET_MAP[c];
        let carry = 0;
        for (let j = 0; j < bytes.length; ++j) {
          bytes[j] += carry;
          carry = bytes[j] >> 8;
          bytes[j] &= 0xff;
        }
        while (carry > 0) {
          bytes.push(carry & 0xff);
          carry >>= 8;
        }
      }
      for (let i = 0; i < string.length - 1 && string.charAt(i) === '1'; i++) bytes.push(0);
      return new Uint8Array(bytes.reverse());
    }

    /** Show a result (or the placeholder when empty) inside an .output box */
    function setOutput(box, value) {
      if (!value) {
        box.className = 'output';
        box.innerHTML = '<span class="placeholder">Output will appear here…</span>';
        return;
      }
      box.className = 'output has-value';
      box.innerHTML = `<span></span><button class="btn btn-sm" type="button">${X.icon('copy', 'icon-sm')} Copy</button>`;
      box.firstElementChild.textContent = value;
      box.querySelector('button').addEventListener('click', () => X.copy(value));
    }

    X.$('#encodeBtn').addEventListener('click', () => {
      const input = X.$('#encodeInput').value;
      if (!input) return setOutput(X.$('#encodeOut'), '');
      try {
        const encoded = encodeBase58(new TextEncoder().encode(input));
        setOutput(X.$('#encodeOut'), encoded);
        X.track('/base58/log', { type: 'encode', input, output: encoded });
      } catch (err) {
        X.toast('Encoding failed: ' + err.message, 'error');
      }
    });

    X.$('#decodeBtn').addEventListener('click', () => {
      const input = X.$('#decodeInput').value.trim();
      if (!input) return setOutput(X.$('#decodeOut'), '');
      try {
        const decoded = new TextDecoder().decode(decodeBase58(input));
        setOutput(X.$('#decodeOut'), decoded);
        X.track('/base58/log', { type: 'decode', input, output: decoded });
      } catch (err) {
        setOutput(X.$('#decodeOut'), '');
        X.toast('Invalid Base58 string: ' + err.message, 'error');
      }
    });
  </script>
</body>
</html>
