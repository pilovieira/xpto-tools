<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Signer — XPTO Tools</title>
  <meta name="description" content="Place a signature image on a PDF, right in your browser.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/xpto.css">
  <script src="/public/xpto.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    .step { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .step b { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 12px; }

    #sig-preview-wrap { display: none; margin-top: 10px; padding: 10px; text-align: center; background:
      repeating-conic-gradient(var(--surface-3) 0% 25%, var(--surface-2) 0% 50%) 50% / 14px 14px; border: 1px solid var(--border); border-radius: 10px; }
    #sig-preview { max-height: 70px; margin: 0 auto; }

    .page-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #page-info { font: 600 14px var(--mono); }

    .placed { display: flex; flex-direction: column; gap: 6px; }
    .placed-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; font-size: 13.5px; font-weight: 500; }

    .workspace { position: sticky; top: calc(var(--nav-h) + 16px); }
    #canvas-area {
      position: relative; overflow: auto; display: flex; justify-content: center; align-items: flex-start;
      min-height: 520px; max-height: calc(100vh - var(--nav-h) - 48px); padding: 24px;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
    }
    #placeholder { align-self: center; text-align: center; color: var(--faint); }
    #placeholder svg { width: 72px; height: 72px; margin: 0 auto 14px; }

    /* The canvas keeps its native pixel size: placement maths depends on it */
    #pdf-wrapper { position: relative; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); background: #fff; line-height: 0; }
    #pdf-canvas { display: block; }
    #sig-overlay {
      position: absolute; display: none; cursor: move; touch-action: none;
      border: 2px dashed var(--accent); background: rgba(139, 123, 255, .08);
    }
    #sig-img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none; }
    #resize-handle {
      position: absolute; right: -8px; bottom: -8px; width: 16px; height: 16px; cursor: nwse-resize;
      background: var(--accent); border: 2px solid #fff; border-radius: 50%; touch-action: none;
    }
    @media (max-width: 960px) { .workspace { position: static; } #canvas-area { min-height: 360px; } }
  </style>
</head>
<body data-area="public" data-active="pdf-signer">
  <main class="container wide">
    <div data-page-head data-tool="pdf-signer"></div>

    <div class="split">
      <aside class="card stack">
        <div>
          <div class="step"><b>1</b> Document</div>
          <label class="dropzone compact" id="dz-pdf">
            <input type="file" id="input-pdf" accept="application/pdf">
            <svg class="icon" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/></svg>
            <strong>Drop a PDF or click to browse</strong>
            <div class="file-name" id="pdf-name"></div>
          </label>
        </div>

        <div>
          <div class="step"><b>2</b> Signature</div>
          <label class="dropzone compact" id="dz-sig">
            <input type="file" id="input-sig" accept="image/png,image/jpeg,image/webp">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <strong>Drop a signature image</strong>
            <span>PNG with transparency works best</span>
            <div class="file-name" id="sig-name"></div>
          </label>
          <div id="sig-preview-wrap"><img id="sig-preview" src="" alt="Signature preview"></div>
        </div>

        <div class="field" id="size-field" style="display:none">
          <label for="sig-width">Signature width</label>
          <div class="range-row"><input type="range" id="sig-width" min="40" max="600" value="180"><span class="range-val" id="width-val" style="min-width:68px">180 px</span></div>
        </div>

        <div id="nav-section" style="display:none">
          <div class="step"><b>3</b> Page</div>
          <div class="page-nav">
            <button class="btn btn-icon" id="btn-prev" aria-label="Previous page"></button>
            <span id="page-info">1 / 1</span>
            <button class="btn btn-icon" id="btn-next" aria-label="Next page"></button>
          </div>
        </div>

        <div id="placed-section" style="display:none">
          <div class="step"><b>4</b> Placed signatures</div>
          <div class="placed" id="pages-list"></div>
          <p class="hint" id="placed-hint">None yet — drag the signature onto the page.</p>
        </div>

        <button class="btn btn-primary btn-lg btn-block" id="btn-download" style="display:none"></button>
      </aside>

      <section class="workspace">
        <div id="canvas-area">
          <div id="placeholder">
            <svg viewBox="0 0 64 64" fill="none"><rect x="8" y="4" width="36" height="48" rx="3" stroke="currentColor" stroke-width="2.5"/><path d="M44 4l8 8" stroke="currentColor" stroke-width="2.5"/><rect x="44" y="4" width="8" height="8" rx="1" stroke="currentColor" stroke-width="2.5"/><line x1="16" y1="22" x2="36" y2="22" stroke="currentColor" stroke-width="2"/><line x1="16" y1="30" x2="36" y2="30" stroke="currentColor" stroke-width="2"/><line x1="16" y1="38" x2="28" y2="38" stroke="currentColor" stroke-width="2"/></svg>
            <p>Upload a PDF to begin</p>
          </div>
          <div id="pdf-wrapper" style="display:none">
            <canvas id="pdf-canvas"></canvas>
            <div id="sig-overlay">
              <img id="sig-img" src="" alt="Signature">
              <div id="resize-handle"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const DOWNLOAD_LABEL = `${X.icon('download', 'icon-sm')} Download signed PDF`;

    /* ── State ── */
    let pdfDoc = null;       // pdf.js document
    let pdfBytes = null;     // ArrayBuffer of the original PDF
    let sigDataUrl = null;   // signature as data URL (preview)
    let sigBytes = null;     // signature bytes for pdf-lib
    let sigMimeType = 'image/png';
    let currentPage = 1;
    let totalPages = 0;
    const renderScale = 1.5;
    const placements = [];   // { page, x, y, w, h } in canvas px

    /* ── DOM ── */
    const pdfCanvas = X.$('#pdf-canvas');
    const pdfWrapper = X.$('#pdf-wrapper');
    const sigOverlay = X.$('#sig-overlay');
    const sigImg = X.$('#sig-img');
    const sigWidthRange = X.$('#sig-width');
    const widthVal = X.$('#width-val');
    const btnPrev = X.$('#btn-prev');
    const btnNext = X.$('#btn-next');
    const btnDownload = X.$('#btn-download');
    const pagesList = X.$('#pages-list');
    const resizeHandle = X.$('#resize-handle');

    btnPrev.innerHTML = X.icon('left');
    btnNext.innerHTML = X.icon('right');
    btnDownload.innerHTML = DOWNLOAD_LABEL;

    const readFile = (file, method) => new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = reject;
      fr[method](file);
    });

    /* ── Rendering ── */
    async function renderPage(num) {
      const page = await pdfDoc.getPage(num);
      const vp = page.getViewport({ scale: renderScale });
      pdfCanvas.width = vp.width;
      pdfCanvas.height = vp.height;
      await page.render({ canvasContext: pdfCanvas.getContext('2d'), viewport: vp }).promise;

      X.$('#page-info').textContent = `${num} / ${totalPages}`;
      btnPrev.disabled = num === 1;
      btnNext.disabled = num === totalPages;
      updateOverlayFromPlacement();
    }

    function showOverlay(p) {
      Object.assign(sigOverlay.style, { left: p.x + 'px', top: p.y + 'px', width: p.w + 'px', height: p.h + 'px', display: 'block' });
    }

    function updateOverlayFromPlacement() {
      const pl = placements.find(p => p.page === currentPage);
      if (pl && sigDataUrl) showOverlay(pl);
      else sigOverlay.style.display = 'none';
    }

    /* ── Loading files ── */
    async function loadPDF(file) {
      try {
        X.$('#pdf-name').textContent = file.name;
        pdfBytes = await readFile(file, 'readAsArrayBuffer');
        pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise;
        totalPages = pdfDoc.numPages;
        currentPage = 1;

        X.$('#placeholder').style.display = 'none';
        pdfWrapper.style.display = 'inline-block';
        X.$('#nav-section').style.display = totalPages > 1 ? 'block' : 'none';
        X.$('#placed-section').style.display = 'block';

        placements.length = 0;
        refreshBadges();
        checkDownloadReady();
        await renderPage(currentPage);
        X.toast(`Loaded “${file.name}” — ${totalPages} page${totalPages > 1 ? 's' : ''}`);
      } catch (err) {
        console.error(err);
        X.toast('Could not open that PDF.', 'error');
      }
    }

    async function loadSignature(file) {
      sigMimeType = file.type || 'image/png';
      sigBytes = await readFile(file, 'readAsArrayBuffer');
      sigDataUrl = await readFile(file, 'readAsDataURL');
      sigImg.src = sigDataUrl;
      X.$('#sig-name').textContent = file.name;
      X.$('#sig-preview-wrap').style.display = 'block';
      X.$('#sig-preview').src = sigDataUrl;
      X.$('#size-field').style.display = 'flex';

      const w = parseInt(sigWidthRange.value);
      if (pdfDoc) {
        // Wait for the preview <img> to know its natural size before estimating height
        await X.$('#sig-preview').decode().catch(() => {});
        setPlacement(currentPage, pdfCanvas.width / 2 - w / 2, pdfCanvas.height / 2 - 40, w, estimateHeight(w));
      }
      X.toast('Signature loaded — drag it into position');
    }

    function estimateHeight(w) {
      const img = X.$('#sig-preview');
      return img.naturalWidth ? Math.round(w * img.naturalHeight / img.naturalWidth) : Math.round(w * 0.35);
    }

    /* ── Placements ── */
    function setPlacement(page, x, y, w, h) {
      const obj = { page, x, y, w, h };
      const idx = placements.findIndex(p => p.page === page);
      if (idx >= 0) placements[idx] = obj; else placements.push(obj);
      if (page === currentPage) showOverlay(obj);
      refreshBadges();
      checkDownloadReady();
    }

    function removePlacement(page) {
      const idx = placements.findIndex(p => p.page === page);
      if (idx >= 0) placements.splice(idx, 1);
      if (page === currentPage) sigOverlay.style.display = 'none';
      refreshBadges();
      checkDownloadReady();
    }

    function refreshBadges() {
      pagesList.innerHTML = placements.map(pl => `
        <div class="placed-item"><span>Page ${pl.page}</span>
          <button class="btn btn-ghost btn-icon btn-sm" data-remove="${pl.page}" title="Remove">${X.icon('x', 'icon-sm')}</button></div>`).join('');
      X.$('#placed-hint').style.display = placements.length ? 'none' : 'block';
    }
    pagesList.addEventListener('click', e => {
      const btn = e.target.closest('[data-remove]');
      if (btn) removePlacement(+btn.dataset.remove);
    });

    function checkDownloadReady() {
      btnDownload.style.display = pdfBytes && sigBytes && placements.length ? 'inline-flex' : 'none';
    }

    /* ── Drag / resize ── */
    let dragging = false, resizing = false;
    let dragOffX = 0, dragOffY = 0, resizeStartX = 0, resizeStartW = 0, resizeStartH = 0;

    sigOverlay.addEventListener('pointerdown', e => {
      if (e.target === resizeHandle) return;
      e.preventDefault();
      dragging = true;
      const rect = sigOverlay.getBoundingClientRect();
      dragOffX = e.clientX - rect.left;
      dragOffY = e.clientY - rect.top;
      sigOverlay.setPointerCapture(e.pointerId);
    });

    resizeHandle.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();
      resizing = true;
      resizeStartX = e.clientX;
      resizeStartW = sigOverlay.offsetWidth;
      resizeStartH = sigOverlay.offsetHeight;
      resizeHandle.setPointerCapture(e.pointerId);
    });

    window.addEventListener('pointermove', e => {
      if (dragging) {
        const wrap = pdfWrapper.getBoundingClientRect();
        const x = Math.max(0, Math.min(e.clientX - wrap.left - dragOffX, pdfCanvas.width - sigOverlay.offsetWidth));
        const y = Math.max(0, Math.min(e.clientY - wrap.top - dragOffY, pdfCanvas.height - sigOverlay.offsetHeight));
        sigOverlay.style.left = x + 'px';
        sigOverlay.style.top = y + 'px';
      }
      if (resizing) {
        const newW = Math.max(40, resizeStartW + (e.clientX - resizeStartX));
        sigOverlay.style.width = newW + 'px';
        sigOverlay.style.height = Math.round(newW * resizeStartH / resizeStartW) + 'px';
        sigWidthRange.value = newW;
        widthVal.textContent = newW + ' px';
      }
    });

    window.addEventListener('pointerup', () => {
      if (!dragging && !resizing) return;
      dragging = resizing = false;
      setPlacement(currentPage, parseInt(sigOverlay.style.left), parseInt(sigOverlay.style.top), sigOverlay.offsetWidth, sigOverlay.offsetHeight);
    });

    sigWidthRange.addEventListener('input', () => {
      const w = parseInt(sigWidthRange.value);
      const h = estimateHeight(w);
      widthVal.textContent = w + ' px';
      sigOverlay.style.width = w + 'px';
      sigOverlay.style.height = h + 'px';
      const pl = placements.find(p => p.page === currentPage);
      if (pl) setPlacement(currentPage, pl.x, pl.y, w, h);
    });

    /* ── Page navigation ── */
    btnPrev.addEventListener('click', () => { if (currentPage > 1) renderPage(--currentPage); });
    btnNext.addEventListener('click', () => { if (currentPage < totalPages) renderPage(++currentPage); });

    /* ── File inputs ── */
    X.$('#input-pdf').addEventListener('change', e => { if (e.target.files[0]) loadPDF(e.target.files[0]); });
    X.$('#input-sig').addEventListener('change', e => { if (e.target.files[0]) loadSignature(e.target.files[0]); });

    [['dz-pdf', f => f.type === 'application/pdf', loadPDF], ['dz-sig', f => f.type.startsWith('image/'), loadSignature]].forEach(([id, accept, load]) => {
      const el = X.$('#' + id);
      el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
      el.addEventListener('dragleave', () => el.classList.remove('dragover'));
      el.addEventListener('drop', e => {
        e.preventDefault();
        el.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file && accept(file)) load(file);
      });
    });

    /* ── Export ── */
    btnDownload.addEventListener('click', async () => {
      if (!pdfBytes || !sigBytes || !placements.length) return;
      btnDownload.innerHTML = 'Processing…';
      btnDownload.disabled = true;

      try {
        const doc = await PDFLib.PDFDocument.load(pdfBytes);
        const img = sigMimeType === 'image/png' ? await doc.embedPng(sigBytes)
          : sigMimeType === 'image/jpeg' || sigMimeType === 'image/jpg' ? await doc.embedJpg(sigBytes)
          : await embedViaCanvas(doc);

        for (const pl of placements) {
          const page = doc.getPage(pl.page - 1);
          const { width: pW, height: pH } = page.getSize();
          // canvas px (origin top-left) → PDF user space (origin bottom-left)
          const sx = pW / pdfCanvas.width, sy = pH / pdfCanvas.height;
          page.drawImage(img, { x: pl.x * sx, y: pH - pl.y * sy - pl.h * sy, width: pl.w * sx, height: pl.h * sy });
        }

        const url = URL.createObjectURL(new Blob([await doc.save()], { type: 'application/pdf' }));
        Object.assign(document.createElement('a'), { href: url, download: 'signed-document.pdf' }).click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        X.toast('Signed PDF downloaded');
      } catch (err) {
        console.error(err);
        X.toast('Error: ' + err.message, 'error');
      } finally {
        btnDownload.innerHTML = DOWNLOAD_LABEL;
        btnDownload.disabled = false;
      }
    });

    /** WebP (and other browser-decodable formats) are re-encoded to PNG, which pdf-lib supports */
    async function embedViaCanvas(doc) {
      const bitmap = await createImageBitmap(new Blob([sigBytes], { type: sigMimeType }));
      const canvas = Object.assign(document.createElement('canvas'), { width: bitmap.width, height: bitmap.height });
      canvas.getContext('2d').drawImage(bitmap, 0, 0);
      const png = await new Promise(r => canvas.toBlob(r, 'image/png'));
      return doc.embedPng(await png.arrayBuffer());
    }
  </script>
</body>
</html>
